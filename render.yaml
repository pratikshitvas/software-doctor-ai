services:
  - type: web
    name: software-doctor-ai-app
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run db:generate && npm run build:web
    startCommand: npm --workspace apps/api run db:push && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: software-doctor-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        value: ""
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: FREE_INVESTIGATIONS
        value: "2"
      - key: RESEND_API_KEY
        value: ""
      - key: EMAIL_FROM
        value: Software Doctor AI <onboarding@resend.dev>
databases:
  - name: software-doctor-db
    databaseName: software_doctor
    plan: free
    region: singapore
